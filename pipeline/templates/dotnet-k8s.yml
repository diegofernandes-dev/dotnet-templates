parameters:
  - name: appName
    type: string
  - name: projectPath
    type: string
  - name: imageRepository
    type: string
  - name: helmReleaseName
    type: string
  - name: environments
    type: object
  - name: awsServiceConnection
    type: string
    default: aws-ecr-oidc

stages:
  - stage: CI
    displayName: CI
    jobs:
      - job: Build
        displayName: Build ${{ parameters.appName }}
        pool:
          vmImage: ubuntu-24.04
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Use .NET 10
            inputs:
              packageType: sdk
              version: 10.0.x

          - script: dotnet restore "${{ parameters.projectPath }}"
            displayName: Restore

          - script: dotnet build "${{ parameters.projectPath }}" -c Release --no-restore
            displayName: Build

          - script: dotnet test "${{ parameters.projectPath }}" -c Release --no-build --no-restore
            displayName: Test

          - script: |
              set -euo pipefail
              IMAGE_REPOSITORY="${{ parameters.imageRepository }}"
              if [[ ! "$IMAGE_REPOSITORY" =~ ^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/.+ ]]; then
                echo "imageRepository must match <account>.dkr.ecr.<region>.amazonaws.com/<repo>" >&2
                exit 1
              fi
              REGISTRY="${IMAGE_REPOSITORY%%/*}"
              REGION="$(echo "$REGISTRY" | cut -d. -f4)"
              echo "##vso[task.setvariable variable=EcrRegion]${REGION}"
            displayName: Resolve ECR registry

          - task: AWSShellScript@1
            displayName: Authenticate, build and push linux/amd64 image
            inputs:
              awsCredentials: ${{ parameters.awsServiceConnection }}
              regionName: $(EcrRegion)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                IMAGE_REPOSITORY="${{ parameters.imageRepository }}"
                REGISTRY="${IMAGE_REPOSITORY%%/*}"
                REGION="$(EcrRegion)"
                PROJECT_PATH="${{ parameters.projectPath }}"
                ASSEMBLY_NAME="${PROJECT_PATH##*/}"
                ASSEMBLY_NAME="${ASSEMBLY_NAME%.csproj}"
                IMAGE="${IMAGE_REPOSITORY}:$(Build.SourceVersion)"

                aws sts get-caller-identity

                aws ecr get-login-password --region "${REGION}" | \
                  docker login --username AWS --password-stdin "${REGISTRY}"

                docker buildx create --name ci-amd64 --driver docker-container --use 2>/dev/null \
                  || docker buildx use ci-amd64
                docker buildx inspect --bootstrap

                docker buildx build \
                  --platform linux/amd64 \
                  --provenance=false \
                  --sbom=false \
                  -f pipeline/docker/dotnet.Dockerfile \
                  --build-arg PROJECT_PATH="${PROJECT_PATH}" \
                  --build-arg ASSEMBLY_NAME="${ASSEMBLY_NAME}" \
                  -t "${IMAGE}" \
                  --push \
                  .

  - ${{ each env in parameters.environments }}:
    - stage: Deploy_${{ env.name }}
      displayName: Deploy ${{ env.name }}
      jobs:
        - deployment: Deploy_${{ env.name }}
          displayName: Deploy ${{ parameters.appName }} to ${{ env.name }}
          environment: ${{ env.azureEnvironment }}
          pool:
            name: ${{ env.poolName }}
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self

                  - script: |
                      set -euo pipefail
                      helm upgrade --install "${{ parameters.helmReleaseName }}" "pipeline/helm/application" \
                        --namespace "${{ env.namespace }}" \
                        --set application.name="${{ parameters.appName }}" \
                        --set image.repository="${{ parameters.imageRepository }}" \
                        --set image.tag="$(Build.SourceVersion)" \
                        --wait \
                        --atomic \
                        --timeout 5m
                    displayName: Helm upgrade --install
