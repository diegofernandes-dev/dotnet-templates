parameters:
  - name: appName
    type: string
  - name: projectPath
    type: string
  - name: imageRepository
    type: string
  - name: ciPoolName
    type: string
    default: Default
  - name: helmReleaseName
    type: string
  - name: environments
    type: object

stages:
  - stage: CI
    displayName: CI
    jobs:
      - job: Build
        displayName: Build ${{ parameters.appName }}
        pool:
          name: ${{ parameters.ciPoolName }}
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Use .NET 10
            inputs:
              packageType: sdk
              version: 10.0.x

          - script: dotnet restore "${{ parameters.projectPath }}"
            displayName: Restore

          - script: dotnet build "${{ parameters.projectPath }}" -c Release --no-restore
            displayName: Build

          - script: dotnet test "${{ parameters.projectPath }}" -c Release --no-build --no-restore
            displayName: Test

          - script: |
              set -euo pipefail
              IMAGE_REPOSITORY="${{ parameters.imageRepository }}"
              ASSEMBLY_NAME="$(basename "${{ parameters.projectPath }}" .csproj)"
              IMAGE="${IMAGE_REPOSITORY}:$(Build.SourceVersion)"
              docker build \
                -f pipeline/docker/dotnet.Dockerfile \
                --build-arg PROJECT_PATH="${{ parameters.projectPath }}" \
                --build-arg ASSEMBLY_NAME="${ASSEMBLY_NAME}" \
                -t "${IMAGE}" \
                .
              docker push "${IMAGE}"
            displayName: Docker build and push

  - ${{ each env in parameters.environments }}:
    - stage: Deploy_${{ env.name }}
      displayName: Deploy ${{ env.name }}
      jobs:
        - deployment: Deploy_${{ env.name }}
          displayName: Deploy ${{ parameters.appName }} to ${{ env.name }}
          environment: ${{ env.azureEnvironment }}
          pool:
            name: ${{ env.poolName }}
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self

                  - script: |
                      set -euo pipefail
                      helm upgrade --install "${{ parameters.helmReleaseName }}" "pipeline/helm/application" \
                        --namespace "${{ env.namespace }}" \
                        --set application.name="${{ parameters.appName }}" \
                        --set image.repository="${{ parameters.imageRepository }}" \
                        --set image.tag="$(Build.SourceVersion)" \
                        --wait \
                        --atomic \
                        --timeout 5m
                    displayName: Helm upgrade --install
